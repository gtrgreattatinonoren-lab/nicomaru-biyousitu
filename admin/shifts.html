<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト管理 | にこまる美容室</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="../index.html">
      <img src="../assets/img/logo.png" alt="にこまる美容室 ロゴ" class="brand-logo">
      <span class="brand-text">
        <span class="brand-text-en">STAFF ONLY</span>
        <span class="brand-text-ja">シフト管理</span>
      </span>
    </a>
    <nav class="nav">
      <ul>
        <li><a href="index.html">予約管理へ戻る</a></li>
        <li><button type="button" id="logoutBtn" class="btn btn-outline btn-sm" hidden>ログアウト</button></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section admin-section">
    <div class="container">

      <p class="form-config-warning" id="configWarning" hidden>
        ⚠️ Firebaseの設定がまだ完了していません。README.mdの手順に沿って設定してください。
      </p>

      <!-- ログイン画面 -->
      <div id="loginView" class="login-box">
        <h1 class="section-title">スタッフログイン</h1>
        <p class="section-lead">シフト管理は、あらかじめ登録されたスタッフアカウントのみが利用できます。</p>
        <form id="loginForm" class="booking-form">
          <div class="form-row">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required autocomplete="username">
          </div>
          <div class="form-row">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <p class="form-message" id="loginMessage" role="status"></p>
          <button type="submit" class="btn btn-primary" id="loginBtn">ログイン</button>
        </form>
      </div>

      <!-- シフト管理画面(ログイン後に表示) -->
      <div id="dashboardView" hidden>
        <h1 class="section-title">シフト管理</h1>
        <p class="section-lead">スタッフを選んで、曜日ごとの基本の勤務時間や、特定の日だけの休み・時間変更を登録できます。変更はすぐに予約フォームに反映されます。</p>

        <div class="admin-view-toggle" id="staffTabs"></div>

        <form class="booking-form shift-form" id="shiftForm">
          <div class="form-row">
            <label for="shiftType">種類</label>
            <select id="shiftType" name="type">
              <option value="weekly">曜日パターン(毎週くり返し)</option>
              <option value="exception">特定の日だけ(休み・時間変更)</option>
            </select>
          </div>

          <div class="form-row" id="weekdayRow">
            <label for="shiftWeekday">曜日</label>
            <select id="shiftWeekday" name="weekday">
              <option value="月">月曜日</option>
              <option value="火">火曜日</option>
              <option value="水">水曜日</option>
              <option value="木">木曜日</option>
              <option value="金">金曜日</option>
              <option value="土">土曜日</option>
              <option value="日">日曜日</option>
            </select>
          </div>

          <div class="form-row" id="dateRow" hidden>
            <label for="shiftDate">日付</label>
            <input type="date" id="shiftDate" name="date">
          </div>

          <div class="form-row">
            <label for="shiftWorking">出勤するか</label>
            <select id="shiftWorking" name="working">
              <option value="true">出勤する</option>
              <option value="false">休み</option>
            </select>
          </div>

          <div class="form-row form-row-split" id="timeRow">
            <div>
              <label for="shiftStart">開始時刻</label>
              <select id="shiftStart" name="start"></select>
            </div>
            <div>
              <label for="shiftEnd">終了時刻</label>
              <select id="shiftEnd" name="end"></select>
            </div>
          </div>

          <p class="form-message" id="shiftMessage" role="status"></p>
          <button type="submit" class="btn btn-primary" id="shiftSubmitBtn">この内容で登録する</button>
        </form>

        <h2 class="shift-list-title">曜日ごとの基本パターン</h2>
        <div class="admin-list" id="weeklyList"></div>

        <h2 class="shift-list-title">特定の日の休み・時間変更</h2>
        <p class="admin-empty" id="exceptionEmpty" hidden>登録されている特定日はありません。</p>
        <div class="admin-list" id="exceptionList"></div>
      </div>

    </div>
  </section>
</main>

<script type="module" src="../js/shifts-admin.js"></script>
</body>
</html>
