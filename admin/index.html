<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予約管理 | にこまる美容室</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="../index.html">
      <img src="../assets/img/logo.png" alt="にこまる美容室 ロゴ" class="brand-logo">
      <span class="brand-text">
        <span class="brand-text-en">STAFF ONLY</span>
        <span class="brand-text-ja">予約管理</span>
      </span>
    </a>
    <nav class="nav">
      <ul>
        <li><a href="shifts.html">シフト管理へ</a></li>
        <li><button type="button" id="logoutBtn" class="btn btn-outline btn-sm" hidden>ログアウト</button></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section admin-section">
    <div class="container">

      <p class="form-config-warning" id="configWarning" hidden>
        ⚠️ Firebaseの設定がまだ完了していません。README.mdの手順に沿って設定してください。
      </p>

      <!-- ログイン画面 -->
      <div id="loginView" class="login-box">
        <h1 class="section-title">スタッフログイン</h1>
        <p class="section-lead">予約管理画面は、あらかじめ登録されたスタッフアカウントのみが利用できます。</p>
        <form id="loginForm" class="booking-form">
          <div class="form-row">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required autocomplete="username">
          </div>
          <div class="form-row">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <p class="form-message" id="loginMessage" role="status"></p>
          <button type="submit" class="btn btn-primary" id="loginBtn">ログイン</button>
        </form>
      </div>

      <!-- 予約管理画面(ログイン後に表示) -->
      <div id="dashboardView" hidden>
        <div class="admin-header-row">
          <h1 class="section-title">予約管理</h1>
          <div class="admin-filter" id="statusFilter">
            <button type="button" class="filter-btn is-active" data-status="all">すべて</button>
            <button type="button" class="filter-btn" data-status="pending">受付待ち</button>
            <button type="button" class="filter-btn" data-status="confirmed">確定</button>
            <button type="button" class="filter-btn" data-status="completed">完了</button>
            <button type="button" class="filter-btn" data-status="cancelled">キャンセル</button>
          </div>
        </div>

        <div class="admin-view-toggle" id="viewToggle">
          <button type="button" class="view-btn is-active" data-view="calendar">週間スケジュール</button>
          <button type="button" class="view-btn" data-view="list">予約一覧</button>
        </div>

        <!-- 週間スケジュール表示 -->
        <div id="calendarView">
          <div class="calendar-nav">
            <button type="button" class="btn btn-outline btn-sm" id="prevWeekBtn">‹ 前の週</button>
            <span class="calendar-week-label" id="weekLabel"></span>
            <button type="button" class="btn btn-outline btn-sm" id="nextWeekBtn">次の週 ›</button>
            <button type="button" class="btn btn-outline btn-sm" id="todayBtn">今週</button>
          </div>
          <p class="calendar-hint">枠をクリックすると、下の一覧でその予約を確認できます。</p>
          <div class="calendar-scroll">
            <table class="calendar-table" id="calendarTable"></table>
          </div>
        </div>

        <!-- 予約一覧表示 -->
        <div id="listView" hidden>
          <p class="admin-empty" id="emptyMessage" hidden>該当する予約はありません。</p>
          <div class="admin-list" id="bookingList"></div>
        </div>
      </div>

    </div>
  </section>
</main>

<!-- 予約詳細モーダル(週間スケジュールの枠をクリックすると表示) -->
<div class="modal-overlay" id="bookingModal" hidden>
  <div class="modal-box">
    <button type="button" class="modal-close" id="modalCloseBtn" aria-label="閉じる">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
